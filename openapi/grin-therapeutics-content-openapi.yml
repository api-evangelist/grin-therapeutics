openapi: 3.1.0
info:
  title: GRIN Therapeutics Content API
  version: wp/v2
  summary: Anonymously readable WordPress REST content API behind grintherapeutics.com.
  description: >-
    The read-only content surface GRIN Therapeutics exposes at https://grintherapeutics.com/wp-json.
    GRIN Therapeutics is a clinical-stage biotechnology company developing radiprodil for
    GRIN-related neurodevelopmental disorder, tuberous sclerosis complex and focal cortical
    dysplasia type II; it runs no developer program and markets no product API. This document is
    an API Evangelist derivation of the WordPress `wp/v2` route index the site publishes at
    /wp-json/, restricted to the operations that were verified to return data anonymously on
    2026-08-04. Write operations, `/wp/v2/settings`, the `wp-abilities/v1` namespace, the
    `contact-form-7/v1` namespace and the `mailin/v1` namespace all require authentication and are
    deliberately excluded — see x-api-evangelist-provenance.
  contact:
    name: GRIN Therapeutics
    url: https://grintherapeutics.com/contact/
  x-api-evangelist-provenance: >-
    Derived by the API Evangelist enrichment pipeline from the live WordPress REST route index at
    https://grintherapeutics.com/wp-json/ (138 routes, namespaces oembed/1.0, contact-form-7/v1,
    mailin/v1, wp/v2, wp-site-health/v1, wp-block-editor/v1, wp-abilities/v1) and verified against
    live anonymous responses on 2026-08-04. Generator reported WordPress 7.0.2. Every parameter
    below appears verbatim in the route index `args` for that endpoint. GRIN Therapeutics publishes
    no OpenAPI, no developer documentation and no API reference for this surface; the humanURL in
    apis.yml points at the upstream WordPress REST handbook that defines the wp/v2 contract.
    Nothing here was obtained with credentials.
servers:
  - url: https://grintherapeutics.com/wp-json
    description: Production content API
tags:
  - name: pages
    description: Corporate and clinical-programme pages (10 published at harvest time).
  - name: posts
    description: Blog/news post collection. Registered and reachable, but empty (X-WP-Total 0) — the News page is authored as a WPBakery page, not as posts.
  - name: media
    description: Media library (174 attachments at harvest time).
  - name: taxonomy
    description: Categories and tags. Registered by WordPress core; every term reports count 0 on this deployment.
  - name: users
    description: Public author records.
  - name: search
    description: Cross-content search across published objects.
  - name: discovery
    description: Route, type, taxonomy and status discovery documents.
  - name: oembed
    description: oEmbed 1.0 provider endpoint for grintherapeutics.com URLs.
paths:
  /:
    get:
      tags: [discovery]
      operationId: getApiIndex
      summary: Get the REST API index
      description: Returns the site index — name, description, URL, home, namespaces, authentication methods, and the full route table.
      parameters:
        - $ref: '#/components/parameters/Context'
        - name: namespace
          in: query
          description: Restrict the response to a single namespace.
          schema:
            type: string
            examples: ['wp/v2']
      responses:
        '200':
          description: Site index
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiIndex'
  /wp/v2/posts:
    get:
      tags: [posts]
      operationId: listPosts
      summary: List posts
      description: Lists published posts. This deployment returns an empty array — GRIN Therapeutics authors its news items inside the /news/ page rather than as posts.
      parameters:
        - $ref: '#/components/parameters/Context'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/After'
        - $ref: '#/components/parameters/Before'
        - $ref: '#/components/parameters/ModifiedAfter'
        - $ref: '#/components/parameters/ModifiedBefore'
        - $ref: '#/components/parameters/Exclude'
        - $ref: '#/components/parameters/Include'
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Order'
        - $ref: '#/components/parameters/Slug'
        - name: author
          in: query
          description: Limit result set to posts assigned to specific authors.
          schema:
            type: array
            items: { type: integer }
        - name: author_exclude
          in: query
          description: Ensure result set excludes posts assigned to specific authors.
          schema:
            type: array
            items: { type: integer }
        - name: categories
          in: query
          description: Limit result set to items with specific category terms.
          schema:
            type: array
            items: { type: integer }
        - name: categories_exclude
          in: query
          description: Limit result set to items except those with specific category terms.
          schema:
            type: array
            items: { type: integer }
        - name: tags
          in: query
          description: Limit result set to items with specific post_tag terms.
          schema:
            type: array
            items: { type: integer }
        - name: tags_exclude
          in: query
          description: Limit result set to items except those with specific post_tag terms.
          schema:
            type: array
            items: { type: integer }
        - name: orderby
          in: query
          description: Sort collection by post attribute.
          schema:
            type: string
            enum: [author, date, id, include, modified, parent, relevance, slug, include_slugs, title]
            default: date
        - name: sticky
          in: query
          description: Limit result set to items that are sticky.
          schema: { type: boolean }
        - name: ignore_sticky
          in: query
          description: Whether to ignore sticky posts or not.
          schema: { type: boolean }
        - name: format
          in: query
          description: Limit result set to items assigned one or more given formats.
          schema:
            type: array
            items: { type: string }
        - $ref: '#/components/parameters/Status'
        - $ref: '#/components/parameters/SearchColumns'
        - $ref: '#/components/parameters/SearchSemantics'
      responses:
        '200':
          description: A paginated list of posts. Pagination totals are returned in the X-WP-Total and X-WP-TotalPages headers.
          headers:
            X-WP-Total: { $ref: '#/components/headers/XWPTotal' }
            X-WP-TotalPages: { $ref: '#/components/headers/XWPTotalPages' }
            Link: { $ref: '#/components/headers/LinkPagination' }
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Post' }
        '400': { $ref: '#/components/responses/InvalidParam' }
  /wp/v2/posts/{id}:
    get:
      tags: [posts]
      operationId: getPost
      summary: Get a post
      parameters:
        - $ref: '#/components/parameters/PathId'
        - $ref: '#/components/parameters/Context'
      responses:
        '200':
          description: A post
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Post' }
        '404': { $ref: '#/components/responses/NotFound' }
  /wp/v2/pages:
    get:
      tags: [pages]
      operationId: listPages
      summary: List pages
      description: >-
        Lists published pages. At harvest time this returned the 10 corporate pages: Home,
        About GRIN Therapeutics, Our Science, Disease State, Resources for patients and caregivers,
        News, Careers, Working with Grin Therapeutics (contact), Privacy Policy and Cookie Policy.
      parameters:
        - $ref: '#/components/parameters/Context'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/After'
        - $ref: '#/components/parameters/Before'
        - $ref: '#/components/parameters/ModifiedAfter'
        - $ref: '#/components/parameters/ModifiedBefore'
        - $ref: '#/components/parameters/Exclude'
        - $ref: '#/components/parameters/Include'
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Order'
        - $ref: '#/components/parameters/Slug'
        - name: author
          in: query
          schema: { type: array, items: { type: integer } }
        - name: author_exclude
          in: query
          schema: { type: array, items: { type: integer } }
        - name: menu_order
          in: query
          description: Limit result set to posts with a specific menu_order value.
          schema: { type: integer }
        - name: parent
          in: query
          description: Limit result set to items with particular parent ids.
          schema: { type: array, items: { type: integer } }
        - name: parent_exclude
          in: query
          description: Limit result set to all items except those of a particular parent id.
          schema: { type: array, items: { type: integer } }
        - name: orderby
          in: query
          schema:
            type: string
            enum: [author, date, id, include, modified, parent, relevance, slug, include_slugs, title, menu_order]
            default: date
        - $ref: '#/components/parameters/Status'
        - $ref: '#/components/parameters/SearchColumns'
        - $ref: '#/components/parameters/SearchSemantics'
      responses:
        '200':
          description: A paginated list of pages.
          headers:
            X-WP-Total: { $ref: '#/components/headers/XWPTotal' }
            X-WP-TotalPages: { $ref: '#/components/headers/XWPTotalPages' }
            Link: { $ref: '#/components/headers/LinkPagination' }
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Page' }
              examples:
                corporate-pages:
                  summary: Fields-filtered page list observed 2026-08-04
                  value:
                    - id: 11950
                      slug: about-grin-therapeutics
                      link: https://grintherapeutics.com/about-grin-therapeutics/
                      title: { rendered: About GRIN Therapeutics }
                    - id: 11956
                      slug: our-science
                      link: https://grintherapeutics.com/our-science/
                      title: { rendered: Our Science }
        '400': { $ref: '#/components/responses/InvalidParam' }
  /wp/v2/pages/{id}:
    get:
      tags: [pages]
      operationId: getPage
      summary: Get a page
      description: Returns one page including its rendered content. Note that page bodies on this site are WPBakery (`[vc_row]`) shortcode markup, not clean HTML.
      parameters:
        - $ref: '#/components/parameters/PathId'
        - $ref: '#/components/parameters/Context'
      responses:
        '200':
          description: A page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Page' }
        '404': { $ref: '#/components/responses/NotFound' }
  /wp/v2/media:
    get:
      tags: [media]
      operationId: listMedia
      summary: List media
      description: Lists media library attachments — figures, logos and imagery used across the site. 174 attachments at harvest time.
      parameters:
        - $ref: '#/components/parameters/Context'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/After'
        - $ref: '#/components/parameters/Before'
        - $ref: '#/components/parameters/ModifiedAfter'
        - $ref: '#/components/parameters/ModifiedBefore'
        - $ref: '#/components/parameters/Exclude'
        - $ref: '#/components/parameters/Include'
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Order'
        - $ref: '#/components/parameters/Slug'
        - name: media_type
          in: query
          schema:
            type: string
            enum: [image, video, text, application, audio]
        - name: mime_type
          in: query
          schema: { type: string }
        - name: parent
          in: query
          schema: { type: array, items: { type: integer } }
        - name: parent_exclude
          in: query
          schema: { type: array, items: { type: integer } }
        - name: orderby
          in: query
          schema:
            type: string
            enum: [author, date, id, include, modified, parent, relevance, slug, include_slugs, title]
            default: date
        - $ref: '#/components/parameters/SearchColumns'
        - $ref: '#/components/parameters/SearchSemantics'
      responses:
        '200':
          description: A paginated list of media attachments.
          headers:
            X-WP-Total: { $ref: '#/components/headers/XWPTotal' }
            X-WP-TotalPages: { $ref: '#/components/headers/XWPTotalPages' }
            Link: { $ref: '#/components/headers/LinkPagination' }
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/MediaItem' }
        '400': { $ref: '#/components/responses/InvalidParam' }
  /wp/v2/media/{id}:
    get:
      tags: [media]
      operationId: getMediaItem
      summary: Get a media item
      parameters:
        - $ref: '#/components/parameters/PathId'
        - $ref: '#/components/parameters/Context'
      responses:
        '200':
          description: A media attachment
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MediaItem' }
        '404': { $ref: '#/components/responses/NotFound' }
  /wp/v2/categories:
    get:
      tags: [taxonomy]
      operationId: listCategories
      summary: List categories
      description: Lists post categories. Registered by WordPress core; every term reports count 0 on this deployment because there are no posts.
      parameters:
        - $ref: '#/components/parameters/Context'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/Exclude'
        - $ref: '#/components/parameters/Include'
        - $ref: '#/components/parameters/Order'
        - $ref: '#/components/parameters/Slug'
        - name: hide_empty
          in: query
          schema: { type: boolean, default: false }
        - name: parent
          in: query
          schema: { type: integer }
        - name: post
          in: query
          description: Limit result set to terms assigned to a specific post.
          schema: { type: integer }
        - name: orderby
          in: query
          schema:
            type: string
            enum: [id, include, name, slug, include_slugs, term_group, description, count]
            default: name
      responses:
        '200':
          description: A list of category terms.
          headers:
            X-WP-Total: { $ref: '#/components/headers/XWPTotal' }
            X-WP-TotalPages: { $ref: '#/components/headers/XWPTotalPages' }
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Term' }
        '400': { $ref: '#/components/responses/InvalidParam' }
  /wp/v2/categories/{id}:
    get:
      tags: [taxonomy]
      operationId: getCategory
      summary: Get a category
      parameters:
        - $ref: '#/components/parameters/PathId'
        - $ref: '#/components/parameters/Context'
      responses:
        '200':
          description: A category term
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Term' }
        '404': { $ref: '#/components/responses/NotFound' }
  /wp/v2/tags:
    get:
      tags: [taxonomy]
      operationId: listTags
      summary: List tags
      parameters:
        - $ref: '#/components/parameters/Context'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/Exclude'
        - $ref: '#/components/parameters/Include'
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Order'
        - $ref: '#/components/parameters/Slug'
        - name: hide_empty
          in: query
          schema: { type: boolean, default: false }
        - name: post
          in: query
          schema: { type: integer }
        - name: orderby
          in: query
          schema:
            type: string
            enum: [id, include, name, slug, include_slugs, term_group, description, count]
            default: name
      responses:
        '200':
          description: A list of tag terms.
          headers:
            X-WP-Total: { $ref: '#/components/headers/XWPTotal' }
            X-WP-TotalPages: { $ref: '#/components/headers/XWPTotalPages' }
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Term' }
        '400': { $ref: '#/components/responses/InvalidParam' }
  /wp/v2/tags/{id}:
    get:
      tags: [taxonomy]
      operationId: getTag
      summary: Get a tag
      parameters:
        - $ref: '#/components/parameters/PathId'
        - $ref: '#/components/parameters/Context'
      responses:
        '200':
          description: A tag term
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Term' }
        '404': { $ref: '#/components/responses/NotFound' }
  /wp/v2/users:
    get:
      tags: [users]
      operationId: listUsers
      summary: List users
      description: Lists public author records for the site.
      parameters:
        - $ref: '#/components/parameters/Context'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/Exclude'
        - $ref: '#/components/parameters/Include'
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Order'
        - $ref: '#/components/parameters/Slug'
        - name: orderby
          in: query
          schema:
            type: string
            enum: [id, include, name, registered_date, slug, include_slugs, email, url]
            default: name
        - name: roles
          in: query
          schema: { type: array, items: { type: string } }
        - name: capabilities
          in: query
          schema: { type: array, items: { type: string } }
        - name: who
          in: query
          schema: { type: string, enum: [authors] }
        - name: has_published_posts
          in: query
          schema: { type: boolean }
        - $ref: '#/components/parameters/SearchColumns'
      responses:
        '200':
          description: A list of users.
          headers:
            X-WP-Total: { $ref: '#/components/headers/XWPTotal' }
            X-WP-TotalPages: { $ref: '#/components/headers/XWPTotalPages' }
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/InvalidParam' }
  /wp/v2/users/{id}:
    get:
      tags: [users]
      operationId: getUser
      summary: Get a user
      parameters:
        - $ref: '#/components/parameters/PathId'
        - $ref: '#/components/parameters/Context'
      responses:
        '200':
          description: A user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '404': { $ref: '#/components/responses/NotFound' }
  /wp/v2/search:
    get:
      tags: [search]
      operationId: searchContent
      summary: Search across content
      description: Cross-content search returning lightweight result objects (id, title, url, type, subtype) across every searchable post type.
      parameters:
        - $ref: '#/components/parameters/Context'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/Exclude'
        - $ref: '#/components/parameters/Include'
        - name: type
          in: query
          schema: { type: string, enum: [post, term, post-format], default: post }
        - name: subtype
          in: query
          schema: { type: array, items: { type: string }, default: [any] }
      responses:
        '200':
          description: Search results.
          headers:
            X-WP-Total: { $ref: '#/components/headers/XWPTotal' }
            X-WP-TotalPages: { $ref: '#/components/headers/XWPTotalPages' }
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/SearchResult' }
              examples:
                radiprodil:
                  summary: Observed result for search=radiprodil on 2026-08-04
                  value:
                    - id: 11960
                      title: Resources for patients and caregivers
                      url: https://grintherapeutics.com/resources-for-patients-and-caregivers/
                      type: post
                      subtype: page
        '400': { $ref: '#/components/responses/InvalidParam' }
  /wp/v2/types:
    get:
      tags: [discovery]
      operationId: listTypes
      summary: List post types
      description: Returns the registered post types keyed by slug — post, page, attachment and the WordPress block/template internals.
      parameters:
        - $ref: '#/components/parameters/Context'
      responses:
        '200':
          description: Post type map
          content:
            application/json:
              schema:
                type: object
                additionalProperties: { $ref: '#/components/schemas/PostType' }
  /wp/v2/types/{type}:
    get:
      tags: [discovery]
      operationId: getType
      summary: Get a post type
      parameters:
        - name: type
          in: path
          required: true
          schema: { type: string, examples: ['page'] }
        - $ref: '#/components/parameters/Context'
      responses:
        '200':
          description: A post type
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PostType' }
        '404': { $ref: '#/components/responses/NotFound' }
  /wp/v2/taxonomies:
    get:
      tags: [discovery]
      operationId: listTaxonomies
      summary: List taxonomies
      parameters:
        - $ref: '#/components/parameters/Context'
        - name: type
          in: query
          description: Limit results to taxonomies associated with a specific post type.
          schema: { type: string }
      responses:
        '200':
          description: Taxonomy map
          content:
            application/json:
              schema:
                type: object
                additionalProperties: { $ref: '#/components/schemas/Taxonomy' }
  /wp/v2/statuses:
    get:
      tags: [discovery]
      operationId: listStatuses
      summary: List post statuses
      description: Returns the publicly visible post statuses. Anonymously this returns only `publish`.
      parameters:
        - $ref: '#/components/parameters/Context'
      responses:
        '200':
          description: Status map
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: object
                  properties:
                    name: { type: string }
                    public: { type: boolean }
                    queryable: { type: boolean }
                    slug: { type: string }
                    date_floating: { type: boolean }
  /oembed/1.0/embed:
    get:
      tags: [oembed]
      operationId: getOembed
      summary: Get an oEmbed response for a grintherapeutics.com URL
      parameters:
        - name: url
          in: query
          required: true
          description: The URL of the resource for which to fetch oEmbed data.
          schema: { type: string, format: uri }
        - name: format
          in: query
          schema: { type: string, enum: [json, xml], default: json }
        - name: maxwidth
          in: query
          schema: { type: integer, default: 600 }
      responses:
        '200':
          description: oEmbed 1.0 rich response
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Oembed' }
        '404': { $ref: '#/components/responses/NotFound' }
components:
  headers:
    XWPTotal:
      description: Total number of matching records across all pages.
      schema: { type: integer }
    XWPTotalPages:
      description: Total number of result pages at the current per_page.
      schema: { type: integer }
    LinkPagination:
      description: RFC 8288 Link header carrying rel="next" / rel="prev" page links.
      schema: { type: string }
  parameters:
    Context:
      name: context
      in: query
      description: Scope under which the request is made; determines fields present in response. Anonymous callers may only use `view` and `embed`.
      schema: { type: string, enum: [view, embed, edit], default: view }
    Page:
      name: page
      in: query
      description: Current page of the collection.
      schema: { type: integer, minimum: 1, default: 1 }
    PerPage:
      name: per_page
      in: query
      description: Maximum number of items to be returned in result set. Values outside 1-100 return a 400 rest_invalid_param.
      schema: { type: integer, minimum: 1, maximum: 100, default: 10 }
    Search:
      name: search
      in: query
      description: Limit results to those matching a string.
      schema: { type: string }
    SearchColumns:
      name: search_columns
      in: query
      description: Array of column names to be searched.
      schema: { type: array, items: { type: string } }
    SearchSemantics:
      name: search_semantics
      in: query
      description: How to interpret the search input.
      schema: { type: string, enum: [exact] }
    After:
      name: after
      in: query
      description: Limit response to posts published after a given ISO8601 compliant date.
      schema: { type: string, format: date-time }
    Before:
      name: before
      in: query
      description: Limit response to posts published before a given ISO8601 compliant date.
      schema: { type: string, format: date-time }
    ModifiedAfter:
      name: modified_after
      in: query
      description: Limit response to posts modified after a given ISO8601 compliant date.
      schema: { type: string, format: date-time }
    ModifiedBefore:
      name: modified_before
      in: query
      description: Limit response to posts modified before a given ISO8601 compliant date.
      schema: { type: string, format: date-time }
    Exclude:
      name: exclude
      in: query
      description: Ensure result set excludes specific IDs.
      schema: { type: array, items: { type: integer } }
    Include:
      name: include
      in: query
      description: Limit result set to specific IDs.
      schema: { type: array, items: { type: integer } }
    Offset:
      name: offset
      in: query
      description: Offset the result set by a specific number of items.
      schema: { type: integer }
    Order:
      name: order
      in: query
      description: Order sort attribute ascending or descending.
      schema: { type: string, enum: [asc, desc], default: desc }
    Slug:
      name: slug
      in: query
      description: Limit result set to posts with one or more specific slugs.
      schema: { type: array, items: { type: string } }
    Status:
      name: status
      in: query
      description: Limit result set to posts assigned one or more statuses. Anonymous callers may only request `publish`.
      schema: { type: array, items: { type: string }, default: [publish] }
    PathId:
      name: id
      in: path
      required: true
      description: Unique identifier for the object.
      schema: { type: integer }
  responses:
    NotFound:
      description: The requested object does not exist.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          examples:
            invalid-id:
              value:
                code: rest_post_invalid_id
                message: Invalid post ID.
                data: { status: 404 }
    InvalidParam:
      description: One or more query parameters failed validation.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          examples:
            per-page-out-of-bounds:
              value:
                code: rest_invalid_param
                message: 'Invalid parameter(s): per_page'
                data:
                  status: 400
                  params:
                    per_page: per_page must be between 1 (inclusive) and 100 (inclusive)
    Unauthorized:
      description: Authentication is required for this operation or context.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          examples:
            forbidden:
              value:
                code: rest_forbidden
                message: Sorry, you are not allowed to do that.
                data: { status: 401 }
  schemas:
    RenderedText:
      type: object
      properties:
        rendered: { type: string }
    Error:
      type: object
      description: The WordPress REST error envelope. Note this is NOT RFC 9457 application/problem+json — it is served as application/json with code/message/data.
      required: [code, message, data]
      properties:
        code: { type: string, description: Machine-readable error slug, e.g. rest_post_invalid_id. }
        message: { type: string, description: Human-readable message. }
        data:
          type: object
          properties:
            status: { type: integer }
            params: { type: object, additionalProperties: { type: string } }
            details: { type: object }
    Post:
      type: object
      properties:
        id: { type: integer }
        date: { type: string, format: date-time }
        date_gmt: { type: string, format: date-time }
        guid: { $ref: '#/components/schemas/RenderedText' }
        modified: { type: string, format: date-time }
        modified_gmt: { type: string, format: date-time }
        slug: { type: string }
        status: { type: string }
        type: { type: string }
        link: { type: string, format: uri }
        title: { $ref: '#/components/schemas/RenderedText' }
        content: { $ref: '#/components/schemas/RenderedText' }
        excerpt: { $ref: '#/components/schemas/RenderedText' }
        author: { type: integer, description: User id — resolves via getUser. }
        featured_media: { type: integer, description: Media id — resolves via getMediaItem. }
        categories: { type: array, items: { type: integer } }
        tags: { type: array, items: { type: integer } }
        _links: { type: object }
    Page:
      type: object
      properties:
        id: { type: integer }
        date: { type: string, format: date-time }
        date_gmt: { type: string, format: date-time }
        guid: { $ref: '#/components/schemas/RenderedText' }
        modified: { type: string, format: date-time }
        modified_gmt: { type: string, format: date-time }
        slug: { type: string }
        status: { type: string }
        type: { type: string }
        link: { type: string, format: uri }
        title: { $ref: '#/components/schemas/RenderedText' }
        content: { $ref: '#/components/schemas/RenderedText' }
        excerpt: { $ref: '#/components/schemas/RenderedText' }
        author: { type: integer }
        featured_media: { type: integer }
        parent: { type: integer, description: Parent page id — pages are hierarchical. }
        menu_order: { type: integer }
        template: { type: string }
        _links: { type: object }
    MediaItem:
      type: object
      properties:
        id: { type: integer }
        date: { type: string, format: date-time }
        guid: { $ref: '#/components/schemas/RenderedText' }
        modified: { type: string, format: date-time }
        slug: { type: string }
        type: { type: string, const: attachment }
        link: { type: string, format: uri }
        title: { $ref: '#/components/schemas/RenderedText' }
        author: { type: integer }
        caption: { $ref: '#/components/schemas/RenderedText' }
        alt_text: { type: string }
        media_type: { type: string }
        mime_type: { type: string }
        post: { type: integer, nullable: true, description: Id of the post the attachment is attached to. }
        source_url: { type: string, format: uri }
        media_details: { type: object }
        _links: { type: object }
    Term:
      type: object
      properties:
        id: { type: integer }
        count: { type: integer }
        description: { type: string }
        link: { type: string, format: uri }
        name: { type: string }
        slug: { type: string }
        taxonomy: { type: string }
        parent: { type: integer }
        meta: { type: array, items: { type: object } }
        _links: { type: object }
    User:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        url: { type: string }
        description: { type: string }
        link: { type: string, format: uri }
        slug: { type: string }
        avatar_urls: { type: object, additionalProperties: { type: string, format: uri } }
        meta: { type: array, items: { type: object } }
        _links: { type: object }
    SearchResult:
      type: object
      properties:
        id: { type: integer }
        title: { type: string }
        url: { type: string, format: uri }
        type: { type: string }
        subtype: { type: string }
        _links: { type: object }
    PostType:
      type: object
      properties:
        description: { type: string }
        hierarchical: { type: boolean }
        has_archive: { type: boolean }
        name: { type: string }
        slug: { type: string }
        icon: { type: string, nullable: true }
        taxonomies: { type: array, items: { type: string } }
        rest_base: { type: string }
        rest_namespace: { type: string }
        _links: { type: object }
    Taxonomy:
      type: object
      properties:
        name: { type: string }
        slug: { type: string }
        description: { type: string }
        types: { type: array, items: { type: string } }
        hierarchical: { type: boolean }
        rest_base: { type: string }
        rest_namespace: { type: string }
        _links: { type: object }
    Oembed:
      type: object
      properties:
        version: { type: string, const: '1.0' }
        provider_name: { type: string }
        provider_url: { type: string, format: uri }
        author_name: { type: string }
        author_url: { type: string, format: uri }
        title: { type: string }
        type: { type: string }
        width: { type: integer }
        height: { type: integer }
        html: { type: string }
    ApiIndex:
      type: object
      properties:
        name: { type: string }
        description: { type: string }
        url: { type: string, format: uri }
        home: { type: string, format: uri }
        gmt_offset: { type: number }
        namespaces: { type: array, items: { type: string } }
        authentication: { type: object }
        site_icon_url: { type: string, format: uri }
        routes: { type: object }
