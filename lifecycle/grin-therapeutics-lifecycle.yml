note: >-
  Lifecycle posture for the GRIN Therapeutics Content API. GRIN Therapeutics publishes no versioning
  policy, no deprecation policy, no SLA, no status page and no API changelog, because it runs no
  developer program — the surface catalogued here is the site's own CMS content API. Absence is
  recorded as absence. No StatusPage and no Deprecation pointers are emitted in apis.yml, because
  neither thing exists; emitting them would credit the provider with operational transparency it does
  not publish.
