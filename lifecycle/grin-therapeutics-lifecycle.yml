  note: >-
    The version namespace is set by WordPress core, not by GRIN Therapeutics. The site's REST index
    lists every registered namespace — oembed/1.0, contact-form-7/v1, mailin/v1, wp/v2,
    wp-site-health/v1, wp-block-editor/v1, wp-abilities/v1 — so a consumer can detect namespace
    changes by polling /wp-json/. The site reported WordPress 7.0.2 in its generator meta tag on
    2026-08-04; the platform version, and therefore the contract, moves on WordPress core's release
    train and outside GRIN Therapeutics' announcement.
