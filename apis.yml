apis:
- aid: grin-therapeutics:grin-therapeutics-content-api
  name: GRIN Therapeutics Content API
  description: >-
    The anonymously readable WordPress REST API behind grintherapeutics.com. It exposes the ten
    published corporate and clinical-programme pages (Home, About GRIN Therapeutics, Our Science,
    Disease State, Resources for patients and caregivers, News, Careers, Working with Grin
    Therapeutics, Privacy Policy, Cookie Policy), the 174-item media library including the scientific
    figures used across the science pages, the registered post types, taxonomies and statuses, the
    public author records, cross-content search, and the oEmbed 1.0 provider endpoint. The `posts`
    collection is registered and reachable but empty — GRIN Therapeutics authors its news and
    corporate-event items inside the /news/ page as WPBakery shortcode markup rather than as posts,
    so the press-release archive is not individually addressable over the API. This is not a
    developer product GRIN Therapeutics markets; it is the site's own content surface, registered at
    /wp-json/ and verified to return data without credentials. The OpenAPI in this repo is derived
    from the published route index.
  humanURL: https://developer.wordpress.org/rest-api/
  baseURL: https://grintherapeutics.com/wp-json
  tags:
  - content
  - wordpress
  - corporate
  - media
  properties:
  - type: OpenAPI
    url: openapi/grin-therapeutics-content-openapi.yml
  - type: Overlay
    url: overlays/grin-therapeutics-content-overlay.yaml
  - type: Authentication
    url: authentication/grin-therapeutics-authentication.yml
  - type: ErrorCatalog
    url: errors/grin-therapeutics-problem-types.yml
  - type: Conventions
    url: conventions/grin-therapeutics-conventions.yml
  - type: DataModel
    url: data-model/grin-therapeutics-data-model.yml
  x-contract-provenance: >-
    Derived by the API Evangelist enrichment pipeline from the WordPress REST route index the site
    publishes at https://grintherapeutics.com/wp-json/ — 138 routes across the namespaces oembed/1.0,
    contact-form-7/v1, mailin/v1, wp/v2, wp-site-health/v1, wp-block-editor/v1 and wp-abilities/v1 —
    and verified against live anonymous responses on 2026-08-04 (generator reported WordPress 7.0.2).
    Only operations that returned data without credentials are modelled. Notably the site registers
    the WordPress Abilities API (`wp-abilities/v1`), an agent-facing capability registry, but every
    endpoint under it returns 401 rest_forbidden anonymously, so no agent surface is claimed here.
    /wp/v2/settings returns 401, /wp/v2/comments returns 403 rest_comment_disabled, and
    contact-form-7/v1/contact-forms returns 403. GRIN Therapeutics publishes no developer
    documentation, no API reference, no getting-started guide and no support channel for this
    surface, so no Documentation/APIReference/GettingStarted pointers are emitted; the humanURL above
    is the upstream WordPress REST handbook that defines the wp/v2 contract.
