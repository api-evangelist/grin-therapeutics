aid: grin-therapeutics
name: GRIN Therapeutics
description: >-
  GRIN Therapeutics, Inc. is a clinical-stage biotechnology company dedicated to the research and
  development of precision therapeutics for pediatric neurodevelopmental disorders caused by NMDA
  receptor dysfunction. It is an affiliate of Neurvati Neurosciences, a Blackstone Life Sciences
  portfolio company, and traces its founding to Dr. Pierandrea Muglia's attendance at the 2019 CFERV
  Conference on GRIN Variants at Emory University. Its lead investigational asset is radiprodil, an
  orally bioavailable selective negative allosteric modulator of the GluN2B subunit of the NMDA
  receptor, designed to fine-tune dysregulated receptor activity rather than fully block the channel.
  Radiprodil is in development for GRIN-related neurodevelopmental disorder (GRIN-NDD) arising from
  gain-of-function variants in GRIN1, GRIN2A, GRIN2B and GRIN2D, and for tuberous sclerosis complex
  (TSC) and focal cortical dysplasia (FCD) type II. The clinical programme comprises the completed
  Phase 1b/2a Honeycomb trial, the enrolling global Phase 3 Beeline registrational trial, the Phase
  1b/2a Astroscape trial in TSC and FCD type II, and a GRIN-NDD natural history study; radiprodil
  carries FDA Breakthrough Therapy, Orphan Drug and Rare Pediatric Disease designations and EMA PRIME
  and Orphan Drug designations. In May 2025 GRIN Therapeutics entered an exclusive collaboration with
  Angelini Pharma to develop and commercialise radiprodil outside North America. GRIN Therapeutics
  runs no developer program and publishes no product API, no developer portal and no API
  documentation; the only machine-readable surface reachable without credentials is the WordPress
  REST content API behind grintherapeutics.com, catalogued here.
